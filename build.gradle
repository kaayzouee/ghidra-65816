plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def ghidraInstallDir = System.getenv('GHIDRA_INSTALL_DIR')
if (!ghidraInstallDir) {
    throw new GradleException('GHIDRA_INSTALL_DIR must point to a Ghidra installation')
}

apply from: new File(ghidraInstallDir, 'support/buildExtension.gradle')

def compiledLanguage = layout.buildDirectory.file('sleigh/65816.sla')
tasks.register('compileExtensionLanguage', JavaExec) {
    inputs.files(fileTree('data/languages') { include '*.slaspec', '*.sinc' })
    inputs.property('ghidraVersion', ghidra_version)
    outputs.file(compiledLanguage)
    classpath = sourceSets.main.compileClasspath
    mainClass = 'ghidra.pcodeCPort.slgh_compile.SleighCompile'
    args file('data/languages/65816.slaspec'), compiledLanguage.get().asFile
    doFirst { compiledLanguage.get().asFile.parentFile.mkdirs() }
}

buildExtension {
    dependsOn compileExtensionLanguage
    from(compiledLanguage) { into "${project.name}/data/languages" }
    eachFile { entry ->
        def path = entry.path.substring(entry.path.indexOf('/') + 1)
        if (path == 'data/languages/65816.sla') {
            if (entry.file != compiledLanguage.get().asFile) entry.exclude()
        } else if (!(path in ['Module.manifest', 'extension.properties', 'LICENSE', 'README.md',
                              "lib/${project.name}.jar".toString(), "lib/${project.name}-src.zip".toString()]) &&
                   !(path ==~ /data\/languages\/658[^\/]*\.(sinc|slaspec|cspec|pspec|ldefs|opinion)/) &&
                   !(path ==~ /scripts\/[^\/]+\.java/) && !(path ==~ /docs\/[^\/]+\.md/)) {
            entry.exclude()
        }
    }
    includeEmptyDirs = false
}

test {
    useJUnitPlatform()

    // Ghidra documents this factory override for Gradle test JVMs. Without it,
    // HeadlessGhidraApplicationConfiguration can fail during startup on Java 21
    // with "Cannot replace filter factory: BuiltinFilterFactory".
    systemProperty 'jdk.serialFilterFactory', 'ghidra.framework.remote.GhidraSerialFilterFactory'

    testLogging {
        events 'started', 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
        showStandardStreams = true
        exceptionFormat 'full'
    }

    def externalModules = System.getenv('GHIDRA_EXTERNAL_MODULES')
    if (externalModules) {
        systemProperty 'ghidra.external.modules', externalModules
    }
}
