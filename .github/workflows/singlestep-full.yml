name: Full SingleStepTests (maintainers only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singlestep-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-corpus:
    name: Run 25,600 SingleStepTests cases
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify pinned Ghidra release
        id: ghidra
        env:
          GHIDRA_VERSION: "12.1.4"
          GHIDRA_RELEASE_DATE: "20260921"
          GHIDRA_SHA256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra.zip"
          install_root="$RUNNER_TEMP/ghidra-unpacked"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_RELEASE_DATE}.zip"

          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${GHIDRA_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"

          application_properties="$(find "$install_root" -type f -path '*/Ghidra/application.properties' -print -quit)"
          test -n "$application_properties"
          ghidra_home="$(dirname "$(dirname "$application_properties")")"
          echo "home=$ghidra_home" >> "$GITHUB_OUTPUT"

      - name: Compile SLEIGH and prepare the external language module
        env:
          GHIDRA_HOME: ${{ steps.ghidra.outputs.home }}
        run: |
          set -euo pipefail
          module_dir="$GHIDRA_HOME/Ghidra/Processors/65816"
          mkdir -p "$module_dir"
          cp Module.manifest "$module_dir/Module.manifest"
          bash scripts/ci/compile-sleigh.sh "$GHIDRA_HOME" "$module_dir/data/languages"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_HOME" >> "$GITHUB_ENV"
          echo "GHIDRA_EXTERNAL_MODULES=$module_dir" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Fetch all 25,600 pinned SingleStepTests cases
        run: python scripts/ci/fetch-singlestep-subset.py build/singlestep/full.json 50 --all

      - name: Verify fetched corpus size
        run: python -c 'import json; p="build/singlestep/full.json"; n=len(json.load(open(p, encoding="utf-8"))); print(f"Loaded {n} cases"); assert n == 25600, f"expected 25600 cases, got {n}"'

      - name: Run full P-code emulator corpus
        env:
          SINGLESTEP_FIXTURE: build/singlestep/full.json
        run: gradle --no-daemon test --info --stacktrace

      - name: Upload full-corpus diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singlestep-full-diagnostics
          if-no-files-found: ignore
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            hs_err_pid*.log
