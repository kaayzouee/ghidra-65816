name: SLEIGH validation

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleigh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 65816 language
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run semantic regression tests and metadata checks
        run: python -m unittest discover --start-directory tests --verbose

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify pinned Ghidra release
        id: ghidra
        env:
          GHIDRA_VERSION: "12.1.4"
          GHIDRA_RELEASE_DATE: "20260921"
          GHIDRA_SHA256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra.zip"
          install_root="$RUNNER_TEMP/ghidra-unpacked"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_RELEASE_DATE}.zip"

          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${GHIDRA_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"

          application_properties="$(find "$install_root" -type f -path '*/Ghidra/application.properties' -print -quit)"
          test -n "$application_properties"
          ghidra_home="$(dirname "$(dirname "$application_properties")")"
          echo "home=$ghidra_home" >> "$GITHUB_OUTPUT"

      - name: Compile the SLEIGH language twice and verify deterministic output
        run: bash scripts/ci/compile-sleigh.sh "${{ steps.ghidra.outputs.home }}"
