name: SLEIGH validation

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:
    inputs:
      require_bank_wrap:
        description: "Require hardware-correct bank-wrapped instruction fetch (fails until P0 is fixed)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sleigh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Ghidra ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "12.1"
            release_date: "20260513"
            sha256: "aa5cbcbbf48f41ca185fce900e19592f1ade4cd5994eb6e0ede468dac8a6f302"
            java: "21"
            gradle: "8.5"
          - version: "12.1.2"
            release_date: "20260605"
            sha256: "b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"
            java: "21"
            gradle: "8.5"
          - version: "12.1.3"
            release_date: "20260817"
            sha256: "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54"
            java: "21"
            gradle: "8.5"
          - version: "12.1.4"
            release_date: "20260921"
            sha256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
            java: "21"
            gradle: "8.5"
          - version: "12.2"
            release_date: "20261016"
            sha256: "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67"
            java: "25"
            gradle: "9.1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run semantic regression tests and metadata checks
        run: python -m unittest discover --start-directory tests --verbose

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download and verify pinned Ghidra release
        id: ghidra
        env:
          GHIDRA_VERSION: ${{ matrix.version }}
          GHIDRA_RELEASE_DATE: ${{ matrix.release_date }}
          GHIDRA_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra.zip"
          install_root="$RUNNER_TEMP/ghidra-unpacked"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_RELEASE_DATE}.zip"

          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${GHIDRA_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"

          application_properties="$(find "$install_root" -type f -path '*/Ghidra/application.properties' -print -quit)"
          test -n "$application_properties"
          ghidra_home="$(dirname "$(dirname "$application_properties")")"
          echo "home=$ghidra_home" >> "$GITHUB_OUTPUT"

      - name: Compile SLEIGH and prepare the external language module
        env:
          GHIDRA_HOME: ${{ steps.ghidra.outputs.home }}
        run: |
          set -euo pipefail
          module_dir="$GHIDRA_HOME/Ghidra/Processors/65816"
          mkdir -p "$module_dir"
          cp Module.manifest "$module_dir/Module.manifest"
          bash scripts/ci/compile-sleigh.sh "$GHIDRA_HOME" "$module_dir/data/languages"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_HOME" >> "$GITHUB_ENV"
          echo "GHIDRA_EXTERNAL_MODULES=$module_dir" >> "$GITHUB_ENV"

      - name: Run headless disassembly regressions
        run: python scripts/ci/test-issue-disassembly.py

      - name: Characterize M/X widths after subroutine returns
        run: python scripts/ci/test-callee-width.py

      - name: Characterize instruction fetch at program-bank boundary
        env:
          GHIDRA_BANK_WRAP_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_bank_wrap && '1' || '0' }}
        run: python scripts/ci/test-bank-boundary.py

      - name: Run absolute-target display regressions
        run: python scripts/ci/test-absolute-target-display.py

      - name: Run near/far calling-convention regressions
        run: python scripts/ci/test-call-conventions.py

      - name: Check calling-convention ABI reference snapshot
        run: python scripts/ci/check-abi-reference.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Fetch bounded SingleStepTests subset
        run: python scripts/ci/fetch-singlestep-subset.py build/singlestep/subset.json 10

      - name: Run P-code emulator tests
        env:
          SINGLESTEP_FIXTURE: build/singlestep/subset.json
        run: gradle --no-daemon test --info --stacktrace

      - name: Upload runtime-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-diagnostics-${{ matrix.version }}
          if-no-files-found: ignore
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            hs_err_pid*.log
