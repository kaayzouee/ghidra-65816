name: Create missing triage labels

on:
  repository_dispatch:
    types: [create-triage-labels]

permissions:
  contents: read
  issues: write

concurrency:
  group: create-triage-labels
  cancel-in-progress: false

jobs:
  labels:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await require('./.github/triage/classify.cjs').createMissing({ github, context, core });
